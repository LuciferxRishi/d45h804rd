<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{% block title %}RBI Grade B{% endblock %}</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet">

<style>
    /* ================= MATERIAL 3 DESIGN TOKENS ================= */
    :root {
        /* Palette: Dark M3 (Deep Purple/Violet base) */
        --md-sys-color-background: #141218;
        --md-sys-color-on-background: #E6E1E5;
        
        --md-sys-color-surface: #141218;
        --md-sys-color-surface-container: #211F26;
        --md-sys-color-surface-container-high: #2B2930;
        
        --md-sys-color-primary: #D0BCFF;
        --md-sys-color-on-primary: #381E72;
        --md-sys-color-primary-container: #4F378B;
        --md-sys-color-on-primary-container: #EADDFF;

        --md-sys-color-secondary: #CCC2DC;
        --md-sys-color-on-secondary: #332D41;
        --md-sys-color-secondary-container: #4A4458;
        --md-sys-color-on-secondary-container: #E8DEF8;

        --md-sys-color-tertiary: #EFB8C8;
        --md-sys-color-tertiary-container: #633B48;

        --md-sys-color-error: #F2B8B5;
        --md-sys-color-error-container: #8C1D18;

        --md-sys-shape-corner-large: 24px;
        --md-sys-shape-corner-medium: 16px;
        --md-sys-shape-corner-full: 999px;

        /* Elevations (3D Depth) */
        --md-sys-elevation-1: 0px 1px 3px 1px rgba(0, 0, 0, 0.15), 0px 1px 2px 0px rgba(0, 0, 0, 0.3);
        --md-sys-elevation-2: 0px 2px 6px 2px rgba(0, 0, 0, 0.15), 0px 1px 2px 0px rgba(0, 0, 0, 0.3);
        --md-sys-elevation-3: 0px 4px 8px 3px rgba(0, 0, 0, 0.15), 0px 1px 3px 0px rgba(0, 0, 0, 0.3);
    }

    body {
        background-color: var(--md-sys-color-background);
        color: var(--md-sys-color-on-background);
        font-family: 'Roboto', sans-serif;
        margin: 0;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
    }

    /* Reset Materialize Defaults */
    nav { background: transparent; box-shadow: none; height: auto; line-height: 1.2; padding: 20px 0; }
    h4, h5, h6 { margin: 0; font-weight: 500; color: var(--md-sys-color-on-background); }
    h4 { font-size: 2rem; letter-spacing: -0.5px; margin-bottom: 24px; color: var(--md-sys-color-primary); }
    
    a { color: var(--md-sys-color-primary); transition: all 0.2s ease; }
    a:hover { opacity: 0.8; text-decoration: none; }

    /* ================= COMPONENTS ================= */

    /* 1. M3 CARD (Replaces .glass) */
    .glass {
        background: var(--md-sys-color-surface-container);
        border-radius: var(--md-sys-shape-corner-large);
        padding: 24px;
        margin-bottom: 24px;
        box-shadow: var(--md-sys-elevation-1);
        border: none; /* Removed neon borders */
        transition: transform 0.2s cubic-bezier(0.2, 0, 0, 1), box-shadow 0.2s;
        position: relative;
        overflow: hidden;
    }

    .glass:hover {
        background: var(--md-sys-color-surface-container-high);
        box-shadow: var(--md-sys-elevation-2);
        transform: translateY(-2px);
    }

    /* 2. M3 BUTTONS */
    .btn, .btn-small, .btn-large {
        background-color: var(--md-sys-color-primary);
        color: var(--md-sys-color-on-primary);
        border-radius: var(--md-sys-shape-corner-full);
        box-shadow: var(--md-sys-elevation-1);
        font-weight: 500;
        letter-spacing: 0.5px;
        text-transform: none; /* M3 uses sentence/title case */
        height: 40px;
        line-height: 40px;
        padding: 0 24px;
        border: none;
    }

    .btn:hover, .btn-small:hover {
        background-color: #EADDFF; /* lighter primary */
        box-shadow: var(--md-sys-elevation-2);
    }

    .btn-flat {
        background: transparent;
        color: var(--md-sys-color-primary);
        box-shadow: none;
    }
    .btn-flat:hover { background: rgba(208, 188, 255, 0.08); }

    /* Red/Danger Button Override */
    .btn.red, .btn-small.red {
        background-color: var(--md-sys-color-error);
        color: #410e0b;
    }

    /* 3. METRICS & TEXT */
    .metric {
        font-size: 2.5rem;
        font-weight: 400; /* M3 uses lighter weights for large type */
        color: var(--md-sys-color-on-surface);
        margin: 8px 0;
    }
    .subtext {
        font-size: 0.875rem;
        color: var(--md-sys-color-secondary);
        font-weight: 500;
        letter-spacing: 0.1px;
    }

    /* 4. PROGRESS BARS */
    .progress {
        background-color: var(--md-sys-color-surface-container-high);
        border-radius: 10px;
        height: 8px !important;
    }
    .determinate {
        border-radius: 10px;
    }

    /* 5. NAVIGATION */
    .brand-logo {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--md-sys-color-on-background) !important;
        font-size: 1.5rem !important;
        font-weight: 500;
    }
    .countdown-chip {
        background: var(--md-sys-color-secondary-container);
        color: var(--md-sys-color-on-secondary-container);
        padding: 8px 16px;
        border-radius: 12px;
        font-size: 0.9rem;
        font-weight: 600;
        display: inline-block;
        margin-left: auto;
    }

    /* 6. INPUTS & FORMS */
    input[type=text], input[type=password], input[type=email] {
        color: var(--md-sys-color-on-surface);
        border-bottom: 1px solid var(--md-sys-color-secondary);
    }
    input:focus {
        border-bottom: 2px solid var(--md-sys-color-primary) !important;
        box-shadow: none !important;
    }

    /* Details/Summary (Threat Monitor) */
    details > summary {
        list-style: none;
        outline: none;
    }
    details[open] summary {
        margin-bottom: 16px;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        padding-bottom: 8px;
    }
    
    /* Utility helpers to override legacy inline styles */
    .text-dim { color: var(--md-sys-color-secondary) !important; }
    .text-primary { color: var(--md-sys-color-primary) !important; }
    
</style>
</head>

<body>

<nav>
    <div class="container" style="display: flex; align-items: center; justify-content: space-between;">
        <a href="/" class="brand-logo">
            <span class="material-icons-round" style="font-size: 32px; color: var(--md-sys-color-primary);">account_balance</span>
            RBI Grade B
        </a>
        <div class="countdown-chip">
            {{ days_left }} Days Left
        </div>
    </div>
</nav>

<div class="container">
    {% block content %}{% endblock %}
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>

<script>
    // Auto-init Materialize components
    document.addEventListener('DOMContentLoaded', function() {
        M.AutoInit();
    });
</script>

{% block extra_js %}{% endblock %}

</body>
</html>
