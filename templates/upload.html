{% extends "base.html" %}
{% block title %}Upload Data{% endblock %}

{% block content %}

<div class="row">
    <div class="col s12 m8 offset-m2">
        <h4 class="center-align">Upload CSV Manifest</h4>

        <div class="glass" style="padding: 40px; text-align: center;">
            <form method="POST" enctype="multipart/form-data">
                
                <div class="file-field input-field" style="border: 2px dashed var(--md-sys-color-secondary); padding: 40px; border-radius: 24px; transition: 0.3s; background: rgba(255,255,255,0.02);">
                    <div style="margin-bottom: 20px;">
                        <i class="material-icons-round" style="font-size: 4rem; color: var(--md-sys-color-primary)">cloud_upload</i>
                        <p style="margin: 10px 0; color: var(--md-sys-color-on-surface);">Drag and drop file here</p>
                    </div>
                    
                    <div class="btn" style="float: none; margin: 0 auto; display: inline-block;">
                        <span>Select File</span>
                        <input type="file" name="file" required>
                    </div>
                    <div class="file-path-wrapper" style="max-width: 300px; margin: 20px auto 0 auto;">
                        <input class="file-path validate" type="text" style="text-align: center; color: var(--md-sys-color-on-surface); border-bottom-color: var(--md-sys-color-secondary);">
                    </div>
                </div>

                <button type="submit" class="btn-large" style="margin-top: 30px; width: 100%; border-radius: 100px;">
                    Initiate Upload
                </button>
            </form>
        </div>

        <div class="center-align">
            <a href="/" class="btn-flat">Cancel</a>
        </div>
    </div>
</div>

<style>
    .file-field:hover {
        border-color: var(--md-sys-color-primary) !important;
        background: rgba(208, 188, 255, 0.05) !important;
    }
</style>

{% endblock %}
